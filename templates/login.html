<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal Login | Employee Leave & Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0B192C 0%, #1E3E62 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: #1B365D;
            padding: 2.25rem 2rem 2rem;
            text-align: center;
            color: #FFFFFF;
        }
        .login-body {
            padding: 2rem;
        }
        .form-control:focus {
            border-color: #0284C7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .btn-login {
            background: #1B365D;
            color: #FFFFFF;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            width: 100%;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background: #2A4D7A;
            color: #FFFFFF;
        }
        .demo-badge-btn {
            font-size: 0.78rem;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #CBD5E1;
            background: #F8FAFC;
            transition: all 0.2s ease;
        }
        .demo-badge-btn:hover {
            background: #E2E8F0;
            border-color: #94A3B8;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="d-inline-flex p-3 bg-white bg-opacity-10 rounded-circle mb-3">
                <i class="bi bi-shield-lock-fill text-white fs-3"></i>
            </div>
            <h4 class="fw-bold mb-1">Workforce Management</h4>
            <p class="small text-white-50 mb-0">Leave, Attendance & Business Intelligence Portal</p>
        </div>

        <div class="login-body">
            <!-- Quick Demo Credentials Selector -->
            <div class="p-3 bg-light rounded-3 border mb-3">
                <div class="small fw-bold text-secondary mb-2 d-flex align-items-center justify-content-between">
                    <span><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins:</span>
                    <span class="badge bg-secondary-subtle text-secondary">Click to fill</span>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="demo-badge-btn text-danger fw-semibold" onclick="fillCreds('admin', 'admin123')">
                        <i class="bi bi-shield-fill-check me-1"></i> Admin
                    </button>
                    <button type="button" class="demo-badge-btn text-primary fw-semibold" onclick="fillCreds('hr', 'hr123')">
                        <i class="bi bi-person-gear me-1"></i> HR Manager
                    </button>
                    <button type="button" class="demo-badge-btn text-success fw-semibold" onclick="fillCreds('emp101', 'emp123')">
                        <i class="bi bi-person-fill me-1"></i> Employee (Jestin)
                    </button>
                </div>
            </div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-dark">Username or Corporate Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" class="form-control" placeholder="e.g. admin or emp101" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-bold text-dark">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-login mb-3">
                    <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>

            <div class="text-center text-muted small pt-2 border-top">
                <span>Enterprise Stack: Python Flask &bull; MySQL &bull; Power BI</span>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            btn.disabled = true;
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Authenticated!',
                        text: data.message,
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = data.redirect_url;
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: data.message,
                        confirmButtonColor: '#1B365D'
                    });
                    btn.disabled = false;
                    btnText.classList.remove('d-none');
                    btnSpinner.classList.add('d-none');
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'System Error',
                    text: 'Unable to connect to server. Check backend status.',
                    confirmButtonColor: '#1B365D'
                });
                btn.disabled = false;
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        }
    </script>
</body>
</html>
